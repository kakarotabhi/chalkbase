name: Frontend

on:
  # Only main. Branch pushes are already covered by the pull_request trigger below, and
  # listening to both ran every suite twice on every PR.
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'contracts/**'
      - 'ops/docker/Dockerfile.frontend'
      - 'ops/docker/nginx.conf'
      - '.github/workflows/frontend.yml'
  # No path filter on pull_request: these checks are required for merge, and a required check
  # that never starts blocks the PR forever. The job is 25s, so running it on every PR is cheap.
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Frontend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,scss}"

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

      # Regenerated from the committed spec rather than from a running backend: this job never
      # starts one. It catches the other half of the drift — a contracts/openapi.json that moved
      # without contracts/api-types.ts being regenerated from it, and any change of generator
      # version or flags that would silently alter every type in the app.
      - name: Contract types are up to date
        run: npm run contracts:types

      - name: Contract is up to date
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- contracts/; then
            echo
            echo '::error::contracts/api-types.ts is not what contracts/openapi.json generates.'
            echo 'Run this and commit what it produces:'
            echo
            echo '    cd frontend && npm run contracts:types'
            echo
            exit 1
          fi

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: chalkbase-web-dist
          path: frontend/dist/chalkbase-web/
          retention-days: 7

  image:
    name: Frontend image
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/Dockerfile.frontend
          push: false
          tags: chalkbase-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
