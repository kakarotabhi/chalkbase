name: Frontend

on:
  push:
    branches: ['**']
    paths:
      - 'frontend/**'
      - 'ops/docker/Dockerfile.frontend'
      - 'ops/docker/nginx.conf'
      - '.github/workflows/frontend.yml'
  # No path filter on pull_request: these checks are required for merge, and a required check
  # that never starts blocks the PR forever. The job is 25s, so running it on every PR is cheap.
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Frontend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,scss}"

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: chalkbase-web-dist
          path: frontend/dist/chalkbase-web/
          retention-days: 7

  image:
    name: Frontend image
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/Dockerfile.frontend
          push: false
          tags: chalkbase-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
