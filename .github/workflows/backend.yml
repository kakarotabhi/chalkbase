name: Backend

on:
  # Only main. Branch pushes are already covered by the pull_request trigger below, and
  # listening to both ran every suite twice on every PR.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ops/docker/Dockerfile.backend'
      - '.github/workflows/backend.yml'
  # No path filter on pull_request: these checks are required for merge, and a required check
  # that never starts blocks the PR forever. The job is 30s, so running it on every PR is cheap.
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` is the whole gate: tests, the Spring Modulith boundary check and the
      # Spotless format check. Keep it as one step so CI and `./mvnw verify` cannot drift.
      - name: Verify
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: chalkbase-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  image:
    name: Backend image
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only, no push: Coolify builds from the repository. This step exists so a broken
      # Dockerfile fails here instead of during a deploy.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/Dockerfile.backend
          push: false
          tags: chalkbase-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
