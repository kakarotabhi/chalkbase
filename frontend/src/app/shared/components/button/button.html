<button
  [class]="classes()"
  [attr.type]="type()"
  [disabled]="isInert()"
  [attr.aria-busy]="loading() ? 'true' : null"
>
  <!--
    Both layers sit in the same grid cell, so the button is as wide as the wider of the two and
    swapping between them cannot reflow the form around it.
  -->
  <span class="btn__stack">
    <span class="btn__label" [class.is-hidden]="loading()"><ng-content /></span>

    @if (loading()) {
      <span class="btn__progress">
        <svg
          class="btn__spinner"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle class="btn__spinner-track" cx="12" cy="12" r="9" stroke-width="2.5" />
          <path
            class="btn__spinner-head"
            d="M21 12a9 9 0 0 0-9-9"
            stroke-width="2.5"
            stroke-linecap="round"
          />
        </svg>
        @if (loadingLabel()) {
          <span>{{ loadingLabel() }}</span>
        }
      </span>
    }
  </span>
</button>
