<div class="password">
  <input
    class="input"
    [class.input--invalid]="invalid()"
    [attr.id]="id()"
    [attr.type]="revealed() ? 'text' : 'password'"
    [attr.placeholder]="placeholder() || null"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [readOnly]="readOnly()"
    [disabled]="isDisabled()"
    [value]="value()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />

  <button
    class="password__toggle"
    type="button"
    [attr.aria-label]="toggleLabel()"
    [attr.aria-pressed]="revealed()"
    [attr.aria-controls]="id()"
    [disabled]="isDisabled()"
    (click)="toggleVisibility()"
  >
    @if (revealed()) {
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M2 12s3.6-7 10-7c1.8 0 3.4.6 4.8 1.4" />
        <path d="M20.4 9.1c1 1.2 1.6 2.2 1.6 2.9 0 0-3.6 7-10 7-1.3 0-2.5-.3-3.6-.8" />
        <path d="M4 4l16 16" />
      </svg>
    } @else {
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>
</div>
