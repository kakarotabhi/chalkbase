<div class="shell">
  <header class="shell__header">
    <span class="shell__brand">Chalkbase</span>
  </header>

  <nav class="shell__nav" aria-label="Primary">
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="is-active" class="shell__nav-link">
        {{ item.label }}
      </a>
    }
  </nav>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
