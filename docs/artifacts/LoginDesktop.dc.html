<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{--bg:#ffffff;--surface:#f6f8f9;--raised:#ffffff;--border:#e2e6ea;--border-strong:#7d8794;--text:#16191d;--muted:#5b6472;--primary:#1f5f4f;--primary-hover:#17493c;--on-primary:#ffffff;--primary-surface:#e6f1ee;--accent:#8a4b1f;--danger:#a52218;--danger-surface:#fdecea;--warning:#8a5000;--warning-surface:#fdf2e0;--success:#1a6b3c;--success-surface:#e6f4ec;--info:#1f5470;--info-surface:#e6f0f5;--r-sm:4px;--r-md:8px;--r-lg:12px;--sh1:0 1px 2px rgba(16,24,40,.06);--sh2:0 4px 12px rgba(16,24,40,.1)}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
    a{color:var(--primary);text-decoration:none}a:hover{color:var(--primary-hover);text-decoration:underline}
    h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid transparent;font:inherit;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
    .btn-primary{background:var(--primary);color:var(--on-primary)}
    .btn-secondary{background:var(--bg);color:var(--text);border-color:var(--border-strong)}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-ghost{background:transparent;color:var(--primary)}
    .btn-block{width:100%}
    .btn-sm{min-height:36px;padding:0 12px;font-size:13px}
    .is-disabled{opacity:.45;cursor:not-allowed}
    .label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
    .req{color:var(--danger);margin-left:2px}
    .input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--bg);color:var(--text);font:inherit;font-size:15px}
    .input::placeholder{color:var(--muted)}
    .input-err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(165,34,24,.12)}
    .input-focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,95,79,.35);outline:none}
    .hint{font-size:13px;color:var(--muted);margin-top:6px}
    .err-text{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--danger);margin-top:6px;font-weight:500}
    .card{background:var(--raised);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh1)}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.4}
    .b-success{background:var(--success-surface);color:var(--success)}
    .b-danger{background:var(--danger-surface);color:var(--danger)}
    .b-warning{background:var(--warning-surface);color:var(--warning)}
    .b-info{background:var(--info-surface);color:var(--info)}
    .b-neutral{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
    .muted{color:var(--muted)}
    .sm{font-size:13px}
    .num{font-variant-numeric:tabular-nums}
    .sk{background:linear-gradient(90deg,#eef1f3 25%,#e4e8eb 37%,#eef1f3 63%);border-radius:var(--r-sm)}
    .banner{display:flex;gap:10px;padding:12px;border-radius:var(--r-sm);font-size:14px;align-items:flex-start}
    .stateLabel{font:600 11px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5b6472;margin-bottom:10px}
  </style>
</helmet>
<div style="width:1280px;height:800px;display:flex">
  <div style="width:512px;background:var(--primary);color:#fff;padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="rgba(255,255,255,.14)"></rect><path d="M9.5 20.5c0-4.4 3-7.8 7.3-7.8 1.9 0 3.4.6 4.6 1.7" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none"></path><circle cx="21.6" cy="19.4" r="2.1" fill="#ffffff"></circle></svg>
      <span style="font-size:18px;font-weight:700;letter-spacing:-.02em">Chalkbase</span>
    </div>
    <div>
      <h2 style="font-size:32px;line-height:1.25;font-weight:600;max-width:19ch">One record for every student, from enquiry to alumni.</h2>
      <p style="margin:18px 0 0;font-size:15px;line-height:1.6;color:rgba(255,255,255,.82);max-width:38ch">Admissions, attendance, fees and results for Indian K–12 schools.</p>
    </div>
    <p class="sm" style="margin:0;color:rgba(255,255,255,.62)">Session 2026–27 · CBSE</p>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px">
    <div style="width:380px">
      <h1 style="font-size:26px">Sign in</h1>
      <p class="muted" style="margin:6px 0 30px">Delhi Public School, R. K. Puram</p>
      
    <div style="display:flex;flex-direction:column;gap:18px">
      <div>
      <label class="label">Username or email<span class="req">*</span></label>
      <div style="position:relative">
        <div class="input" style="display:flex;align-items:center"><span style="color:var(--muted)">priya.sharma</span></div>
        
      </div>
      
    </div>
      <div>
      <label class="label">Password<span class="req">*</span></label>
      <div style="position:relative">
        <div class="input" style="padding-right:48px;display:flex;align-items:center"><span style="color:var(--muted)"></span></div>
        <button type="button" aria-label="Show password" style="position:absolute;right:2px;top:2px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--muted);cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      
    </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <label style="display:flex;align-items:center;gap:9px;min-height:44px;cursor:pointer"><span style="display:flex"><span style="width:20px;height:20px;border-radius:4px;border:1px solid var(--border-strong);background:var(--bg);flex:none"></span></span><span class="sm">Keep me signed in</span></label>
        <a href="#" class="sm" style="font-weight:500">Forgot password?</a>
      </div>
      <button class="btn btn-primary btn-block">Sign in</button>
    </div>
      <p class="sm muted" style="margin:26px 0 0;text-align:center">Trouble signing in? Your school office can reset your password.</p>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
