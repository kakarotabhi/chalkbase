<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{--bg:#ffffff;--surface:#f6f8f9;--raised:#ffffff;--border:#e2e6ea;--border-strong:#7d8794;--text:#16191d;--muted:#5b6472;--primary:#1f5f4f;--primary-hover:#17493c;--on-primary:#ffffff;--primary-surface:#e6f1ee;--accent:#8a4b1f;--danger:#a52218;--danger-surface:#fdecea;--warning:#8a5000;--warning-surface:#fdf2e0;--success:#1a6b3c;--success-surface:#e6f4ec;--info:#1f5470;--info-surface:#e6f0f5;--r-sm:4px;--r-md:8px;--r-lg:12px;--sh1:0 1px 2px rgba(16,24,40,.06);--sh2:0 4px 12px rgba(16,24,40,.1)}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
    a{color:var(--primary);text-decoration:none}a:hover{color:var(--primary-hover);text-decoration:underline}
    h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid transparent;font:inherit;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
    .btn-primary{background:var(--primary);color:var(--on-primary)}
    .btn-secondary{background:var(--bg);color:var(--text);border-color:var(--border-strong)}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-ghost{background:transparent;color:var(--primary)}
    .btn-block{width:100%}
    .btn-sm{min-height:36px;padding:0 12px;font-size:13px}
    .is-disabled{opacity:.45;cursor:not-allowed}
    .label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
    .req{color:var(--danger);margin-left:2px}
    .input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--bg);color:var(--text);font:inherit;font-size:15px}
    .input::placeholder{color:var(--muted)}
    .input-err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(165,34,24,.12)}
    .input-focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,95,79,.35);outline:none}
    .hint{font-size:13px;color:var(--muted);margin-top:6px}
    .err-text{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--danger);margin-top:6px;font-weight:500}
    .card{background:var(--raised);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh1)}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.4}
    .b-success{background:var(--success-surface);color:var(--success)}
    .b-danger{background:var(--danger-surface);color:var(--danger)}
    .b-warning{background:var(--warning-surface);color:var(--warning)}
    .b-info{background:var(--info-surface);color:var(--info)}
    .b-neutral{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
    .muted{color:var(--muted)}
    .sm{font-size:13px}
    .num{font-variant-numeric:tabular-nums}
    .sk{background:linear-gradient(90deg,#eef1f3 25%,#e4e8eb 37%,#eef1f3 63%);border-radius:var(--r-sm)}
    .banner{display:flex;gap:10px;padding:12px;border-radius:var(--r-sm);font-size:14px;align-items:flex-start}
    .stateLabel{font:600 11px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5b6472;margin-bottom:10px}
  </style>
</helmet>
<div style="width:700px;height:720px;display:flex;flex-direction:column;background:var(--bg)">
  <header style="height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px">
      <div style="display:flex;align-items:center;gap:9px;min-width:0"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1f5f4f"></rect><path d="M9.5 20.5c0-4.4 3-7.8 7.3-7.8 1.9 0 3.4.6 4.6 1.7" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none"></path><circle cx="21.6" cy="19.4" r="2.1" fill="#ffffff"></circle></svg><div style="display:flex;align-items:center;gap:9px;min-width:0"><span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">DPS R. K. Puram</span><span class="badge b-neutral" style="flex:none">2026–27</span></div></div>
      <div style="display:flex;align-items:center;gap:2px;color:var(--muted)">
        <span style="width:40px;height:40px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg></span>
        <span style="width:36px;height:36px;border-radius:999px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">RM</span>
      </div>
    </header>
  <div style="flex:1;display:flex;min-height:0">
    <nav aria-label="Primary" style="width:80px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:12px 18px;display:flex;flex-direction:column;gap:4px;align-items:center"><a href="#" title="Dashboard" style="display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;border-radius:var(--r-sm);color:var(--text);background:var(--primary-surface)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect></svg></a><a href="#" title="Students" style="display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;border-radius:var(--r-sm);color:var(--muted);background:transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 19.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5"></path><path d="M16 6.2a3 3 0 0 1 0 5.6"></path><path d="M17.5 14.8c2 .6 3.2 2.4 3.2 4.7"></path></svg></a><a href="#" title="Attendance" style="display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;border-radius:var(--r-sm);color:var(--muted);background:transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M8 3v4"></path><path d="M16 3v4"></path><path d="M8.5 13.5 11 16l4.5-4.5"></path></svg></a><a href="#" title="Fees" style="display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;border-radius:var(--r-sm);color:var(--muted);background:transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5h13v17l-2.2-1.6-2.1 1.6-2.2-1.6-2.2 1.6-2.1-1.6-2.2 1.6z"></path><path d="M9 8h6"></path><path d="M9 11.5h6"></path></svg></a><a href="#" title="Exams" style="display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;border-radius:var(--r-sm);color:var(--muted);background:transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9.5" r="5.5"></circle><path d="M8.5 14.2 7 21l5-2.4L17 21l-1.5-6.8"></path></svg></a><a href="#" title="Communication" style="display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;border-radius:var(--r-sm);color:var(--muted);background:transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12.5c0 3.9-3.8 7-8.5 7-1 0-2-.15-2.9-.42L4 20.5l1.5-3.7C4.3 15.6 3.5 14.1 3.5 12.5c0-3.9 3.8-7 8.5-7s8.5 3.1 8.5 7z"></path></svg></a><a href="#" title="Transport" style="display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;border-radius:var(--r-sm);color:var(--muted);background:transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="12" rx="2"></rect><path d="M3.5 11h17"></path><circle cx="7.5" cy="19" r="1.6"></circle><circle cx="16.5" cy="19" r="1.6"></circle></svg></a></nav>
    <main style="flex:1;padding:24px">
      <h1 style="font-size:22px;margin-bottom:2px">Dashboard</h1>
      <p class="muted sm" style="margin:0 0 20px">Tuesday, 8 September 2026</p>
      <div style="display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:14px">
        <div class="sk" style="height:92px"></div><div class="sk" style="height:92px"></div>
        <div class="sk" style="height:92px"></div><div class="sk" style="height:92px"></div>
      </div>
      <div class="sk" style="height:190px;margin-top:14px"></div>
    </main>
  </div>
</div>
</x-dc>
</body>
</html>
