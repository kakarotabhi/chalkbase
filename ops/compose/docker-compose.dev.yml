# Local PostgreSQL for when the project moves off H2 (ADR-0004).
#   docker compose -f ops/compose/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: chalkbase-postgres
    environment:
      POSTGRES_DB: chalkbase
      POSTGRES_USER: chalkbase
      POSTGRES_PASSWORD: chalkbase
    ports:
      - '5432:5432'
    volumes:
      - chalkbase-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chalkbase']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chalkbase-pgdata:
