server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build artefacts never change; the shell must not be cached.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /index.html {
        add_header Cache-Control "no-store";
    }

    # Angular client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API is proxied so the browser sees one origin. `backend` is the service name in Coolify.
    location /api/ {
        # Stated rather than inherited, and it is COUPLED to the backend's multipart limits.
        #
        # nginx's default is 1m. A request that trips nginx is refused by nginx, which answers with
        # an HTML error page rather than an ADR-0007 envelope — and, being a different origin's
        # error, may reach the browser without CORS headers, so the client reports a network failure
        # instead of "that file is too large". The student import's limits
        # (spring.servlet.multipart.* in application.yml) are deliberately set below this so Spring
        # is always the one refusing, in the shape every client already parses.
        #
        # Raising either number without the other reintroduces exactly that failure. Raise both.
        client_max_body_size 1m;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
