# Common configuration for every environment.
#
# There is deliberately NO datasource here — each profile supplies its own, so no environment can
# accidentally inherit another's database. Profiles: local (developer machine), test (Testcontainers,
# under src/test/resources), prod (environment variables only).
spring:
  application:
    name: chalkbase

  # Running with no profile picks `local`. Production sets SPRING_PROFILES_ACTIVE=prod explicitly.
  profiles:
    default: local

  # Boot auto-configures an in-memory UserDetailsManager — and logs a fresh random password for it
  # at WARN — on every startup where no application-supplied UserDetailsService, AuthenticationManager
  # or AuthenticationProvider bean exists. This application supplies none of those: AuthenticationService
  # (identity module) verifies a submitted password against `user_credential` itself and builds the
  # SecurityContext by hand, never asking a Spring Security AuthenticationManager for one, and
  # SecurityConfig never calls httpBasic() or formLogin() — the two things that would put a filter in
  # the chain that consults it. So the generated user is created but reachable by nothing: no request
  # on any profile is authenticated against it. Excluded here, application-wide, so the warning stops
  # instead of being re-derived by whoever reads the boot log next. Pinned by
  # UserDetailsServiceAutoConfigurationTests.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  jpa:
    hibernate:
      # `validate` cannot work here: it would check one schema, and there are as many as there are
      # schools. Flyway owns the schema and TenantMigrationRunner proves every tenant is current.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # No default_schema. The schema is chosen per connection by
        # SchemaMultiTenantConnectionProvider; the registry tables qualify themselves as `public`.
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    # Off on purpose. Boot's initializer migrates a single schema; ADR-0011 needs `public` plus one
    # run per school, which TenantMigrationRunner does at startup.
    enabled: false

  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Ignore fields the client sends that we do not model, so adding a field to a request DTO is
      # not a breaking change for older clients.
      fail-on-unknown-properties: false
    # Dates are ISO-8601 strings. Not configured here because Jackson 3 already defaults to that —
    # WRITE_DATES_AS_TIMESTAMPS moved from SerializationFeature to DateTimeFeature and defaults off.

  # Paging for every list endpoint (platform.api.PageResponse).
  data:
    web:
      pageable:
        default-page-size: 25
        # Spring's own default is 2000, which nobody chose and which lets `?size=2000` pull a
        # school's whole audit log in one response. 100 is the largest page an admin table has a
        # use for; a caller wanting more asks for more pages.
        max-page-size: 100
        # Pages are zero-based, as the API contract says. Stated rather than inherited: flipping
        # this silently shifts every existing client by one page.
        one-indexed-parameters: false

  # Two uploads share these numbers now: the student import (ADR-0021) and a document attached to a
  # student (ADR-0025) — a scanned certificate or a photo, which needs far more than a CSV of names
  # and dates of birth ever did. They are the guard that runs before any of our code does: the
  # multipart resolver refuses an oversized request while parsing it, and GlobalExceptionHandler maps
  # that to VAL_003 inside the usual envelope.
  #
  # `ops/docker/nginx.conf` proxies /api/ to this service and its `client_max_body_size` is set to
  # match — a request that trips nginx instead comes back as nginx's HTML error page rather than an
  # ADR-0007 envelope, which a client cannot read and which a browser may report as a network failure
  # rather than a 413. Keeping the whole request under nginx's ceiling means *this* service is always
  # the one that refuses, in the one shape every client already parses. Raising either number needs
  # the other raised too, in the same change.
  #
  # 8 MB comfortably holds a scanned certificate or a school photo; the CSV import's own ceiling —
  # 2,000 students across the nine columns it reads, roughly 170 KB — is unaffected in practice by
  # this number being larger than it strictly needs, since StudentImportService's own MAX_ROWS check
  # is what actually bounds that upload.
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
      # The upload never touches the disk, which is what ADR-0021 §6 promises for the student import
      # and what ADR-0025 extends to a document for the same reason: both are, at different times,
      # several hundred children's data or one child's certificate, and neither belongs in the
      # container's temp directory even briefly, unencrypted, left behind entirely if the process
      # dies mid-request. Spring's own default threshold is 0B, meaning EVERY multipart upload is
      # spooled to a temp file without this.
      #
      # Set above max-request-size so nothing is ever spooled: at most 9 MB held in memory per
      # concurrent upload, which is a deliberate trade of some heap headroom for keeping this
      # guarantee application-wide rather than narrowing it to the one upload it used to describe.
      file-size-threshold: 10MB

  threads:
    virtual:
      enabled: true

  # Server-side sessions in PostgreSQL (ADR-0003): forced logout and lockout are requirements, and
  # a restart must not sign every parent out.
  session:
    timeout: 8h
    jdbc:
      # The tables are created by db/migration/shared, alongside every other schema change. Letting
      # Spring Session run its own DDL would put a second, untracked owner on the same tables.
      initialize-schema: never
      # Schema-qualified on purpose. A pooled connection's search_path is whichever school was last
      # served (ADR-0011), so an unqualified `spring_session` would resolve inside a tenant schema —
      # where it does not exist. The session store is the one thing that lives in `public`.
      table-name: public.spring_session
      # `JdbcIndexedSessionRepository` purges expired rows itself: unless this is `-` (disabled) it
      # runs `DELETE ... WHERE expiry_time < ?` against `table-name` above, on its own dedicated
      # `ThreadPoolTaskScheduler` — entirely independent of `chalkbase`'s own
      # `@EnableScheduling`/`TaskScheduler` (`AuditRetentionSchedulingConfiguration`, ADR-0026), and
      # of `TenantRegistry`'s per-school fan-out, because `public.spring_session` is one table for
      # every school rather than one per tenant. So this line changes nothing at runtime — it is the
      # vendor default, made discoverable by reading this file rather than the
      # `spring-session-jdbc` source (ADR-0028). Set to `-` to disable, the same tripwire shape
      # `chalkbase.audit.retention.enabled` uses for the other scheduled job in this codebase.
      cleanup-cron: '0 * * * * *'

server:
  port: ${PORT:8080}
  error:
    # Errors are produced by platform.error.GlobalExceptionHandler, never by the servlet container's
    # default error page. See ADR-0007.
    include-message: never
    include-stacktrace: never
  shutdown: graceful

chalkbase:
  tenancy:
    # One PostgreSQL schema per school (ADR-0011). `public` holds the tenant registry and shared
    # reference data; each school's own data lives in the schema named in public.school.
    platform-schema: public

  audit:
    retention:
      # ADR-0018 left this unset, calling it a legal question. ADR-0026 answers it: seven years,
      # one period for every classification tier rather than a schedule per tier — ADR-0014 asks
      # for a period per category, and the product owner chose a single uniform number instead
      # because it errs long, and long is the safe direction for an audit log. The Indian
      # financial-record convention, and a per-category schedule stays possible later without a
      # schema change. Visible here, not a literal in AuditRetentionPurgeJob, so changing it is a
      # deploy configuration and not a code change.
      years: 7
      # Rows deleted per transaction by AuditRetentionPurgeJob. See its class javadoc for why 500.
      batch-size: 500
      # 02:30 UTC, daily. Chosen to fall outside the school day in every timezone this product
      # ships to; change it if a deployment's traffic pattern ever says otherwise.
      cron: "0 30 2 * * *"
      # The tripwire: an operator can set this to false, without a redeploy, to hold a run back.
      # There is deliberately no API for this — retention is a scheduled platform job, never an
      # endpoint (ADR-0018 §6) — so the environment is the only lever.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    # ADR-0014: Hibernate logs the whole failed INSERT, values included, when a batch entry is
    # rejected — so one duplicate admission number puts a child's name, date of birth and gender
    # in the log at WARN. The constraint name is already logged by GlobalExceptionHandler and
    # mapped to an error code, so nothing diagnostic is lost by silencing this.
    org.hibernate.orm.jdbc.error: ERROR
