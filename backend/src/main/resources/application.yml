# Common configuration for every environment.
#
# There is deliberately NO datasource here — each profile supplies its own, so no environment can
# accidentally inherit another's database. Profiles: local (developer machine), test (Testcontainers,
# under src/test/resources), prod (environment variables only).
spring:
  application:
    name: chalkbase

  # Running with no profile picks `local`. Production sets SPRING_PROFILES_ACTIVE=prod explicitly.
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema. Never let Hibernate create it.
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${chalkbase.db.schema}
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${chalkbase.db.schema}
    default-schema: ${chalkbase.db.schema}
    create-schemas: true
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Ignore fields the client sends that we do not model, so adding a field to a request DTO is
      # not a breaking change for older clients.
      fail-on-unknown-properties: false
    # Dates are ISO-8601 strings. Not configured here because Jackson 3 already defaults to that —
    # WRITE_DATES_AS_TIMESTAMPS moved from SerializationFeature to DateTimeFeature and defaults off.

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    # Errors are produced by platform.error.GlobalExceptionHandler, never by the servlet container's
    # default error page. See ADR-0007.
    include-message: never
    include-stacktrace: never
  shutdown: graceful

chalkbase:
  db:
    # Chalkbase owns one schema. On Supabase this keeps our tables away from the managed
    # auth/storage/realtime schemas; everywhere else it keeps `public` empty and obvious.
    schema: chalkbase

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
