# Production. Everything sensitive comes from the environment — see ops/coolify/.env.example.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2

  jpa:
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    in.chalkbase: INFO
